name: Build AudioScribe Fast

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Estrai progetto
        run: |
          unzip "AudioScribeFast-source.zip"
          ls -la
          ls -la AudioScribeFast

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila APK
        working-directory: AudioScribeFast
        run: gradle assembleDebug --stacktrace

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioScribeFast-APK
          path: AudioScribeFast/app/build/outputs/apk/debug/app-debug.apk
